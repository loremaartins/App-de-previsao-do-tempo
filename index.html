<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Previsão do Tempo</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <div class="container">
    <h1>☀️ Previsão do Tempo</h1>

    <div class="busca-box">
      <input type="text" id="cidade" placeholder="Digite a cidade...">
      <button id="btnBuscar">Buscar</button>
    </div>

    <div id="carregando" class="escondido">
      <p>Buscando dados...</p>
    </div>

    <div id="erro" class="escondido">
      <p>❌ Cidade não encontrada! Tente novamente.</p>
    </div>

    <div id="card" class="escondido">
      <h2 id="nomeCidade">--</h2>
      <p id="dataHora" class="subtitulo">--</p>
      
      <div class="temperatura-box">
        <span id="icone">🌤️</span>
        <span id="tempValor">--°C</span>
      </div>
      <p id="descricao" class="descricao">--</p>

      <div class="detalhes">
        <div class="item">
          <span>💧 Umidade:</span>
          <strong id="umidade">--</strong>
        </div>
        <div class="item">
          <span>💨 Vento:</span>
          <strong id="vento">--</strong>
        </div>
        <div class="item">
          <span>🌡️ Sensação:</span>
          <strong id="sensacao">--</strong>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
